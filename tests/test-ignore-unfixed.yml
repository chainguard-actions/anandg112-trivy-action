name: Test ignore-unfixed option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy scan with ignore-unfixed enabled
        id: trivy-ignore-unfixed
        uses: .
        continue-on-error: true
        with:
          scan-type: image
          image-ref: alpine:3.18
          exit-code: '0'
          ignore-unfixed: 'true'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: table
      - name: Assert scan with ignore-unfixed completed
        env:
          OUTCOME: ${{ steps.trivy-ignore-unfixed.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ignore-unfixed scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (image scanning may require Docker socket access not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
