name: Test exit-code parameter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy scan with exit-code=0 (always succeed)
        id: trivy-exit-code
        uses: .
        continue-on-error: true
        with:
          scan-type: image
          image-ref: alpine:3.18
          exit-code: '0'
          severity: 'CRITICAL'
          format: table
      - name: Assert scan completed with exit-code=0
        env:
          OUTCOME: ${{ steps.trivy-exit-code.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: exit-code=0 scan succeeded regardless of vulnerabilities found"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (image scanning may require Docker socket access not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
