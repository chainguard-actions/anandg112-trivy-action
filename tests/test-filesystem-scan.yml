name: Test filesystem scan
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy filesystem scan
        id: trivy-fs
        uses: .
        continue-on-error: true
        with:
          scan-type: fs
          image-ref: 'none'
          scan-ref: '/github/workspace'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          format: table
      - name: Assert filesystem scan completed
        env:
          OUTCOME: ${{ steps.trivy-fs.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: filesystem scan succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (trivy fs scan may have encountered an issue in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
