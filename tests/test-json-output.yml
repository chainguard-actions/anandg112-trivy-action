name: Test JSON format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy scan with JSON output
        id: trivy-json
        uses: .
        continue-on-error: true
        with:
          scan-type: fs
          image-ref: 'none'
          scan-ref: '/github/workspace'
          exit-code: '0'
          format: json
          output: /github/workspace/trivy-results.json
          severity: 'CRITICAL,HIGH'
      - name: Assert JSON output file was created or action failed gracefully
        env:
          OUTCOME: ${{ steps.trivy-json.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Checking for JSON output file..."
            if [ ! -f "$GITHUB_WORKSPACE/trivy-results.json" ]; then
              echo "FAIL: trivy-results.json was not created"
              exit 1
            fi
            echo "File exists, checking it is valid JSON..."
            if ! python3 -c "import json, sys; json.load(open('$GITHUB_WORKSPACE/trivy-results.json'))" 2>/dev/null; then
              echo "FAIL: trivy-results.json is not valid JSON"
              exit 1
            fi
            echo "PASS: JSON output file created and is valid JSON"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (trivy fs scan may have encountered an issue in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
